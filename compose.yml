services:
  wordpress:
    container_name: wp-container
    image: wordpress:php${APP_PHP_VERSION:-8.4}-apache
    volumes:
      - type: bind
        source: "./project/public"
        target: "/var/www/html"
      - type: bind
        source: "./.docker/php/local/php.ini"
        target: "/usr/local/etc/php/conf.d/php.ini"
    environment:
      WORDPRESS_DB_HOST: "${DATABASE_HOST:-db-container}:3306"
      WORDPRESS_DB_USER: ${DATABASE_USER:-admin}
      WORDPRESS_DB_PASSWORD: ${DATABASE_PASSWORD:-password}
      WORDPRESS_DB_NAME: ${DATABASE_NAME:-wordpress}
      WORDPRESS_TABLE_PREFIX: ${TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${DEBUG_MODE}
    ports:
      - "${WEB_PORT:-8000}:80"
    depends_on:
      database:
        condition: service_healthy

  database:
    container_name: ${DATABASE_HOST:-db-container}
    image: mysql:${MYSQL_VERSION:-latest}
    restart: always
    volumes:
      - type: bind
        source: "./.docker/mysql/local/data"
        target: "/var/lib/mysql"
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-wordpress}
      MYSQL_USER: ${DATABASE_USER:-admin}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-password}
      TZ: ${TIME_ZONE}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DATABASE_ROOT_PASSWORD:-password}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  node:
    container_name: node-container
    image: node:24
    volumes:
      - type: bind
        source: "./project"
        target: "/project"
    working_dir: "/project"
    depends_on:
      - wordpress
    tty: true

  mail:
    container_name: ${MAIL_HOST:-mail-container}
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "${MAIL_PORT}:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 1000
      MP_DATA_FILE: "/data/mailpit.db"
      MP_SMTP_AUTH: "${MAIL_USERNAME}:${MAIL_PASSWORD}"
      MP_SMTP_AUTH_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - type: bind
        source: "./.docker/mail/local/data"
        target: "/data"
